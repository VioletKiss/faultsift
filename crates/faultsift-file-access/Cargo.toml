[package]
name = "faultsift-file-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

# This crate must be able to host narrowly scoped Windows platform FFI
# exceptions. It therefore mirrors the workspace lints while using `deny`
# instead of the workspace's non-overridable `forbid` for unsafe code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
