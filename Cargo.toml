[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/faultsift-core",
    "crates/faultsift-file-access",
    "crates/faultsift-line-access",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
